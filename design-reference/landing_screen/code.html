<!DOCTYPE html>

<meta charset="utf-8"/>

                        "inverse-primary": "#735c00",

                        "inverse-surface": "#e5e2e1",

                        "on-tertiary-fixed-variant": "#27438a",

                        "surface-container": "#201f1f",

                    "spacing": {
                        "unit": "4px",

                        "md": "16px",
                        "xl": "48px",
                        "sm": "8px",
                        "container-max": "1200px",
                        "xxl": "80px",
                        "gutter": "24px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "transcript-body": ["Newsreader", "serif"],
                        "transcript-display": ["Newsreader", "serif"],
                        "ui-label": ["Inter", "sans-serif"],
                        "h1": ["Inter", "sans-serif"],
                        "h2": ["Inter", "sans-serif"],
                        "ui-body": ["Inter", "sans-serif"],
                        "caption": ["Inter", "sans-serif"]

                    "fontSize": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.03) 0%, transparent 60%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-ui-body antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0A0A0A]/80 backdrop-blur-md border-[#2A2A2A] border-b-[1px] flat no-shadows docked full-width">
<div class="flex items-center gap-4">
<button class="text-[#A0A0A0] hover:text-indigo-400 transition-colors duration-300 scale-95 active:opacity-80 md:hidden flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<span class="text-[#D4AF37] font-serif tracking-[0.2em] text-lg font-bold">ELOCUTIONIST</span>
</div>
<!-- Desktop Navigation (injected from BottomNavBar JSON per layout rules) -->
<nav class="hidden md:flex items-center gap-8">
<a class="flex items-center gap-2 text-[#D4AF37] hover:text-indigo-400 transition-colors duration-300 scale-95 active:opacity-80 group" href="#">
<span class="material-symbols-outlined text-sm group-hover:text-indigo-400 transition-colors duration-300" data-icon="edit_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-serif tracking-widest uppercase text-xs font-bold text-[#D4AF37]">Compose</span>
</a>
<a class="flex items-center gap-2 text-[#A0A0A0] hover:text-indigo-400 transition-colors duration-300 scale-95 active:opacity-80 group" href="#">
<span class="material-symbols-outlined text-sm group-hover:text-indigo-400 transition-colors duration-300" data-icon="psychology">psychology</span>
<span class="font-serif tracking-widest uppercase text-xs">Brainstorm</span>
</a>
<a class="flex items-center gap-2 text-[#A0A0A0] hover:text-indigo-400 transition-colors duration-300 scale-95 active:opacity-80 group" href="#">
<span class="material-symbols-outlined text-sm group-hover:text-indigo-400 transition-colors duration-300" data-icon="auto_stories">auto_stories</span>
<span class="font-serif tracking-widest uppercase text-xs">Library</span>
</a>
</nav>
<div class="flex items-center">
<button class="w-8 h-8 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden scale-95 active:opacity-80 transition-all hover:border-[#D4AF37]">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center items-center px-gutter pt-24 pb-28 md:pb-24 relative z-10 w-full max-w-[720px] mx-auto">
<div class="flex flex-col items-center text-center space-y-xl w-full">
<!-- Typography Section -->
<div class="space-y-6 max-w-2xl">
<h1 class="font-h1 text-h1 text-on-surface">Your Five-Minute Masterpiece.</h1>
<p class="font-transcript-display text-transcript-display text-on-surface-variant opacity-90 mx-auto max-w-xl">
                    Craft perfectly structured speeches in minutes with the power of AI.
                </p>
</div>
<!-- Action Section -->
<div class="flex flex-col sm:flex-row items-center gap-md pt-8 w-full sm:w-auto">
<button class="w-full sm:w-auto px-8 py-4 bg-primary text-on-primary rounded-full font-ui-label text-ui-label uppercase tracking-widest hover:bg-primary-fixed transition-colors duration-300 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
                    Start Writing
                </button>
<button class="w-full sm:w-auto px-8 py-4 bg-transparent border border-outline-variant text-on-surface rounded-full font-ui-label text-ui-label uppercase tracking-widest hover:border-secondary hover:text-secondary transition-colors duration-300 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="lightbulb">lightbulb</span>
                    Brainstorm Ideas
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center h-20 pb-safe bg-[#0A0A0A]/90 backdrop-blur-xl border-[#2A2A2A] border-t-[1px] flat no-shadows docked full-width">
<!-- Active Tab: Compose -->
<button class="flex flex-col items-center gap-1 w-full h-full justify-center text-[#D4AF37] font-bold tap-highlight-none active:scale-90 transition-transform">
<span class="material-symbols-outlined mb-1" data-icon="edit_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-sans text-[10px] uppercase tracking-wider">Compose</span>
</button>
<!-- Inactive Tabs -->
<button class="flex flex-col items-center gap-1 w-full h-full justify-center text-[#4A4A4A] hover:text-indigo-300 tap-highlight-none active:scale-90 transition-transform">
<span class="material-symbols-outlined mb-1" data-icon="psychology">psychology</span>
<span class="font-sans text-[10px] uppercase tracking-wider">Brainstorm</span>
</button>
<button class="flex flex-col items-center gap-1 w-full h-full justify-center text-[#4A4A4A] hover:text-indigo-300 tap-highlight-none active:scale-90 transition-transform">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-sans text-[10px] uppercase tracking-wider">Library</span>
</button>
<button class="flex flex-col items-center gap-1 w-full h-full justify-center text-[#4A4A4A] hover:text-indigo-300 tap-highlight-none active:scale-90 transition-transform">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-sans text-[10px] uppercase tracking-wider">Settings</span>
</button>
</nav>
