<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Speech Questionnaire - Elocutionist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e1e0ff",
                        "on-tertiary": "#082b72",
                        "background": "#131313",
                        "surface-dim": "#131313",
                        "on-secondary-container": "#b0b2ff",
                        "on-primary-fixed-variant": "#574500",
                        "surface-variant": "#353534",
                        "surface-container-highest": "#353534",
                        "surface-container-low": "#1c1b1b",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed-dim": "#c0c1ff",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#e9c349",
                        "primary-container": "#d4af37",
                        "inverse-primary": "#735c00",
                        "on-tertiary-container": "#254188",
                        "inverse-surface": "#e5e2e1",
                        "on-surface-variant": "#d0c5af",
                        "on-tertiary-fixed-variant": "#27438a",
                        "on-surface": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed": "#07006c",
                        "surface-bright": "#393939",
                        "secondary-container": "#3131c0",
                        "on-error-container": "#ffdad6",
                        "secondary": "#c0c1ff",
                        "surface-container": "#201f1f",
                        "on-primary": "#3c2f00",
                        "tertiary-container": "#97b0ff",
                        "on-primary-fixed": "#241a00",
                        "primary-fixed": "#ffe088",
                        "on-background": "#e5e2e1",
                        "outline": "#99907c",
                        "tertiary": "#bfcdff",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2a2a2a",
                        "surface": "#131313",
                        "primary": "#f2ca50",
                        "on-tertiary-fixed": "#00174b",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "outline-variant": "#4d4635",
                        "surface-tint": "#e9c349",
                        "on-primary-container": "#554300",
                        "tertiary-fixed": "#dbe1ff",
                        "tertiary-fixed-dim": "#b4c5ff",
                        "on-secondary": "#1000a9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "gutter": "24px",
                        "xl": "48px",
                        "xxl": "80px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "transcript-body": ["Newsreader", "serif"],
                        "transcript-display": ["Newsreader", "serif"],
                        "ui-label": ["Inter", "sans-serif"],
                        "h1": ["Inter", "sans-serif"],
                        "h2": ["Inter", "sans-serif"],
                        "ui-body": ["Inter", "sans-serif"],
                        "caption": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "transcript-body": ["20px", { "lineHeight": "1.8", "letterSpacing": "0", "fontWeight": "400" }],
                        "transcript-display": ["24px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "ui-label": ["13px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "h1": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "h2": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "ui-body": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-ui-body text-ui-body antialiased selection:bg-primary-container selection:text-on-primary-container">
<header class="w-full flex items-center justify-between px-6 h-16 shrink-0 relative z-10">
<button aria-label="Close Questionnaire" class="text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-transcript-display text-transcript-display text-primary tracking-[0.2em] uppercase text-[14px]">
            Elocutionist
        </div>
<div class="w-10"></div>
</header>
<div class="w-full h-[2px] bg-surface-container-high relative shrink-0">
<div class="absolute top-0 left-0 h-full w-[30%] bg-gradient-to-r from-secondary-container to-primary transition-all duration-500 ease-in-out"></div>
</div>
<main class="flex-1 w-full max-w-[720px] mx-auto px-6 py-xxl flex flex-col">
<div class="flex-1 flex flex-col justify-center">
<div class="mb-md">
<span class="font-ui-label text-ui-label text-outline uppercase tracking-widest">
                    Question 3 of 10
                </span>
</div>
<h1 class="font-h2 text-h2 text-on-surface mb-xl max-w-2xl">
                What is the core emotional message you want your audience to feel?
            </h1>
<div class="relative w-full group">
<textarea class="w-full h-48 bg-transparent border-0 border-b border-surface-container-high text-transcript-body font-transcript-body text-on-surface placeholder:text-outline-variant focus:ring-0 focus:border-primary resize-none outline-none py-4 px-0 transition-colors bg-surface-dim/30 backdrop-blur-sm" placeholder="Begin typing your thoughts here..." spellcheck="false"></textarea>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-primary scale-x-0 group-focus-within:scale-x-100 transition-transform duration-300 origin-left"></div>
</div>
</div>
<div class="mt-auto pt-xl flex justify-between items-center w-full border-t border-surface-container-high/50">
<button class="px-6 py-4 border border-surface-container-high text-on-surface hover:text-secondary-fixed hover:border-surface-variant transition-colors duration-200 font-ui-label text-ui-label rounded-DEFAULT flex items-center gap-2 group">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Previous
            </button>
<button class="px-8 py-4 bg-primary text-on-primary hover:bg-primary-fixed transition-colors duration-200 font-ui-label text-ui-label rounded-DEFAULT flex items-center gap-2 group shadow-[0_0_15px_rgba(242,202,80,0.1)] hover:shadow-[0_0_20px_rgba(242,202,80,0.2)]">
                Next
                <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</main>
</body></html>
